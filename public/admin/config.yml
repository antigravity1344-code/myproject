local_backend: true
backend:
  name: git-gateway
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  # ۱. بخش صفحات ثابت
  - name: "pages"
    label: "صفحات"
    files:
      - label: "صفحه اصلی"
        name: "home"
        file: "src/data/home.json"
        fields:
          - { label: "عنوان صفحه", name: "title", widget: "string" }

  # ۲. بخش شعرها (امکان افزودن شعر جدید)
  - name: "poems"
    label: "شعرها"
    folder: "src/content/poems"
    create: true # اجازه ساخت شعر جدید
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "عنوان شعر", name: "title", widget: "string" }
      - { label: "تاریخ", name: "date", widget: "datetime" }
      - { label: "متن شعر", name: "body", widget: "text" }

  # ۳. بخش داستان‌ها (امکان افزودن داستان جدید)
  - name: "stories"
    label: "داستان‌ها"
    folder: "src/content/stories"
    create: true # اجازه ساخت داستان جدید
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "عنوان داستان", name: "title", widget: "string" }
      - { label: "تاریخ", name: "date", widget: "datetime" }
      - { label: "خلاصه داستان", name: "summary", widget: "string", required: false }
      - { label: "متن اصلی داستان", name: "body", widget: "markdown" }